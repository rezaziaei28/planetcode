{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | پلنت کد</title>
    
    <!-- Bootstrap -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'style css/header.css' %}">
    <link rel="stylesheet" href="{% static 'style css/regester_css/login-style.css' %}">
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Back to Home -->
            <div class="back-to-home">
                <a href="/">
                    <i class="fas fa-arrow-right"></i>
                    بازگشت به خانه
                </a>
            </div>
            
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <h1 class="auth-title">خوش آمدید</h1>
                <p class="auth-subtitle">برای ورود، نام کاربری و رمز عبور خود را وارد کنید</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                
                <!-- Username -->
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user"></i> نام کاربری
                    </label>
                    <input type="text" id="username" name="username" 
                           class="form-control" 
                           placeholder="نام کاربری یا ایمیل خود را وارد کنید" 
                           required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> رمز عبور
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" 
                               class="form-control" 
                               placeholder="رمز عبور خود را وارد کنید" 
                               required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="checkmark"></span>
                        مرا به خاطر بسپار
                    </label>
                    <a href="#" class="forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <i class="fas fa-arrow-left"></i>
                    ورود به حساب
                </button>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>یا</span>
                </div>

                <!-- Signup Link -->
                <div class="auth-footer">
                    حساب کاربری ندارید؟
                    <a href="/accounts/signup/">ثبت‌نام کنید</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/header.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
